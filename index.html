<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
const container = document.getElementById('threejs-container-ANIMATION_10');
let width = container.clientWidth || 1440;
let height = container.clientHeight || 640;

const params = new URLSearchParams(window.location.search);
const num = (k, d) => (params.has(k) && Number.isFinite(parseFloat(params.get(k))) ? parseFloat(params.get(k)) : d);
const DPR = num('dpr', Math.min(window.devicePixelRatio || 1, 1.75));

const BG = 0x0b0f18;
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.FogExp2(BG, 0.0072);

const camera = new THREE.PerspectiveCamera(42, width / height, 0.15, 340);
camera.position.set(24, 13, 26);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(width, height);
renderer.setPixelRatio(DPR);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.5;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// ---------------------------------------------------------------------------
// Studio environment: softbox strips baked into a cube, fed through PMREM, so
// brushed steel reads as brushed steel instead of flat plastic.
// ---------------------------------------------------------------------------
function studioEquirect() {
  const W = 1024, H = 512;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0.00, '#0a1020');
  sky.addColorStop(0.42, '#16233a');
  sky.addColorStop(0.55, '#0d1522');
  sky.addColorStop(1.00, '#05070c');
  g.fillStyle = sky;
  g.fillRect(0, 0, W, H);

  const strip = (x, y, w, h, color, alpha) => {
    const gr = g.createLinearGradient(x, y, x, y + h);
    gr.addColorStop(0, `rgba(${color},0)`);
    gr.addColorStop(0.5, `rgba(${color},${alpha})`);
    gr.addColorStop(1, `rgba(${color},0)`);
    g.fillStyle = gr;
    g.fillRect(x, y, w, h);
  };
  strip(90, 40, 240, 210, '255,250,240', 0.95);   // warm key softbox
  strip(520, 70, 150, 150, '210,232,255', 0.85);  // cool fill
  strip(790, 120, 130, 120, '255,196,140', 0.55); // warm kicker
  strip(330, 300, 420, 26, '190,220,255', 0.30);  // horizon bounce

  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envSrc = studioEquirect();
const envRT = pmrem.fromEquirectangular(envSrc);
scene.environment = envRT.texture;
scene.environmentIntensity = 1.55;
envSrc.dispose();
pmrem.dispose();

// ---------------------------------------------------------------------------
// Lights
// ---------------------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0x54749c, 0x121924, 0.85);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4e8, 6.0);
key.position.set(26, 17, 21);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 4;
key.shadow.camera.far = 110;
key.shadow.camera.left = -34;
key.shadow.camera.right = 34;
key.shadow.camera.top = 30;
key.shadow.camera.bottom = -26;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.03;
key.shadow.radius = 2.4;
key.shadow.camera.updateProjectionMatrix();
key.target.position.set(0, 4, -0.5);
scene.add(key, key.target);

const fill = new THREE.DirectionalLight(0x5386ff, 0.95);
fill.position.set(-24, 14, -13);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xc9ecff, 3.6);
rim.position.set(-13, 14, -31);
scene.add(rim);

const stationLight = new THREE.PointLight(0xffb066, 22, 13, 2);
stationLight.position.set(-17.6, 3.2, 4.2);
scene.add(stationLight);

// ---------------------------------------------------------------------------
// Ground: poured concrete + calibration grid, big enough to fill the horizon
// ---------------------------------------------------------------------------
function groundMaps() {
  const S = 1024;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#222834';
  g.fillRect(0, 0, S, S);
  for (let i = 0; i < 240; i++) {
    const x = Math.random() * S, y = Math.random() * S, r = 40 + Math.random() * 150;
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    const v = Math.random() > 0.5 ? 255 : 0;
    grd.addColorStop(0, `rgba(${v},${v},${v},0.022)`);
    grd.addColorStop(1, `rgba(${v},${v},${v},0)`);
    g.fillStyle = grd;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  const cell = S / 8;
  g.lineWidth = 1.6;
  g.strokeStyle = 'rgba(120,150,184,0.22)';
  for (let i = 0; i <= 8; i++) {
    g.beginPath(); g.moveTo(i * cell, 0); g.lineTo(i * cell, S); g.stroke();
    g.beginPath(); g.moveTo(0, i * cell); g.lineTo(S, i * cell); g.stroke();
  }
  const map = new THREE.CanvasTexture(c);
  map.wrapS = map.wrapT = THREE.RepeatWrapping;
  map.repeat.set(9, 9);
  map.colorSpace = THREE.SRGBColorSpace;
  map.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return map;
}

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 300),
  new THREE.MeshStandardMaterial({
    color: 0xffffff,
    map: groundMaps(),
    roughness: 0.82,
    metalness: 0.06
  })
);
ground.rotation.x = -Math.PI * 0.5;
ground.receiveShadow = true;
scene.add(ground);

// ---------------------------------------------------------------------------
// Post: only the LED strips and beacons are allowed to bloom
// ---------------------------------------------------------------------------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(width, height), 0.18, 0.4, 1.1);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------------------------------------------------------------------------
// Telemetry + train
// ---------------------------------------------------------------------------
const PHASE_NAME = {
  1: 'the slow climb',
  2: 'nobody can breathe',
  3: 'upside down, obviously',
  4: 'feet off the seat',
  5: 'brakes, finally'
};

let TELEMETRY = [];
const carGroups = [];
const ids = (k) => document.getElementById(k);

function sampleAt(tNorm) {
  const n = TELEMETRY.length;
  const t = ((tNorm % 1) + 1) % 1;
  const exact = t * n;
  const i0 = Math.floor(exact) % n;
  const i1 = (i0 + 1) % n;
  const f = exact - Math.floor(exact);
  const a = TELEMETRY[i0], b = TELEMETRY[i1];
  const L = (x, y) => x + (y - x) * f;
  const v = (k) => new THREE.Vector3(L(a[k][0], b[k][0]), L(a[k][1], b[k][1]), L(a[k][2], b[k][2]));
  const pos = v('pos'), tan = v('tan').normalize(), upRaw = v('up').normalize();
  const side = tan.clone().cross(upRaw).normalize();
  const up = side.clone().cross(tan).normalize();
  return {
    t,
    pos, tan, up, side,
    alt: L(a.alt, b.alt),
    speed: L(a.speed, b.speed),
    g: L(a.g, b.g),
    bpm: Math.round(L(a.bpm, b.bpm)),
    resp: L(a.resp, b.resp),
    phaseId: a.phaseId,
    phase: PHASE_NAME[a.phaseId] || a.phase
  };
}

const tmpMatrix = new THREE.Matrix4();
function placeTrain(lead) {
  const SPACING = 0.0145;
  for (let i = 0; i < carGroups.length; i++) {
    const s = sampleAt(lead - i * SPACING);
    carGroups[i].position.copy(s.pos);
    tmpMatrix.makeBasis(s.tan, s.up, s.side);
    carGroups[i].quaternion.setFromRotationMatrix(tmpMatrix);
  }
}

const loader = new GLTFLoader();
const errors = (window.__apexErrors = window.__apexErrors || []);

loader.load(
  './assets/apex_coaster.glb',
  (gltf) => {
    const root = gltf.scene;
    root.traverse((child) => {
      if (!child.isMesh) return;
      child.castShadow = true;
      child.receiveShadow = true;
      const mats = Array.isArray(child.material) ? child.material : [child.material];
      mats.forEach((m) => {
        if (!m) return;
        if (/MAT_Emissive/.test(m.name || '')) {
          m.emissive = (m.emissive || new THREE.Color(0xffffff)).clone();
          m.emissiveIntensity = 2.2;
          m.toneMapped = false;
        }
      });
    });

    // Re-parent the five car nodes so each car can be posed on its own spline sample
    const found = [];
    root.traverse((child) => {
      const m = /^Coaster_Car_(\d)$/.exec(child.name || '');
      if (m) found.push({ node: child, idx: parseInt(m[1], 10) });
    });
    found.sort((a, b) => a.idx - b.idx);
    found.forEach(({ node, idx }) => {
      const holder = new THREE.Group();
      scene.add(holder);
      carGroups[idx] = holder;
      holder.add(node);
      node.position.set(0, 0, 0);
      node.rotation.set(0, 0, 0);
      node.updateMatrixWorld(true);
    });
    for (let i = 0; i < 5; i++) {
      if (!carGroups[i]) {
        carGroups[i] = new THREE.Group();
        scene.add(carGroups[i]);
      }
    }

    scene.add(root);
    window.__coasterLoaded = true;
  },
  undefined,
  (err) => {
    errors.push('glb: ' + err);
    window.__coasterLoaded = false;
  }
);

// ---------------------------------------------------------------------------
// Cameras
// ---------------------------------------------------------------------------
let mode = 'ORBIT';
let progress = num('t', 0.12);
let paused = params.has('t');
let camTheta = num('theta', 0.62);
let camPhi = num('phi', 0.29);
const camRadius = 22;
const orbitTarget = new THREE.Vector3(0, 6.4, 0);

function applyCamera(s) {
  if (mode === 'RIDER') {
    camera.fov = 60;
    // sit above the headrest and slightly ahead of the lead car so the crest plate
    // and the restraint tubes never fill the frame
    const eye = s.pos.clone().add(s.up.clone().multiplyScalar(1.55)).add(s.tan.clone().multiplyScalar(2.85));
    camera.position.copy(eye);
    camera.up.copy(s.up);
    camera.lookAt(eye.clone().add(s.tan.clone().multiplyScalar(12)).add(s.up.clone().multiplyScalar(-3.6)));
  } else if (mode === 'CHASE') {
    camera.fov = 56;
    const trail = sampleAt(progress - 0.055);
    camera.position.copy(trail.pos.clone()
      .add(trail.tan.clone().multiplyScalar(-10.5))
      .add(trail.up.clone().multiplyScalar(4.6))
      .add(trail.side.clone().multiplyScalar(3.1)));
    camera.up.set(0, 1, 0);
    camera.lookAt(s.pos.clone().add(s.tan.clone().multiplyScalar(6.5)).add(s.up.clone().multiplyScalar(0.35)));
  } else if (mode === 'SIDE') {
    camera.fov = 34;
    camera.up.set(0, 1, 0);
    camera.position.set(s.pos.x * 0.5, 8.2, 26);
    camera.lookAt(s.pos.x * 0.5, 5.8, 0);
  } else {
    camera.fov = 42;
    camera.up.set(0, 1, 0);
    const tx = orbitTarget.x + s.pos.x * 0.3;
    const ty = orbitTarget.y + (s.pos.y - 6) * 0.22;
    const tz = orbitTarget.z + s.pos.z * 0.25;
    camera.position.set(
      tx + camRadius * Math.sin(camTheta) * Math.cos(camPhi),
      ty + camRadius * Math.sin(camPhi),
      tz + camRadius * Math.cos(camTheta) * Math.cos(camPhi)
    );
    camera.lookAt(tx, ty, tz);
  }
  camera.updateProjectionMatrix();
}

// Orbit drag
let dragging = false, px = 0, py = 0;
renderer.domElement.addEventListener('pointerdown', (e) => { dragging = true; px = e.clientX; py = e.clientY; });
window.addEventListener('pointerup', () => { dragging = false; });
window.addEventListener('pointermove', (e) => {
  if (!dragging || mode !== 'ORBIT') return;
  camTheta -= (e.clientX - px) * 0.007;
  camPhi = Math.max(0.06, Math.min(1.2, camPhi + (e.clientY - py) * 0.006));
  px = e.clientX; py = e.clientY;
});

// ---------------------------------------------------------------------------
// HUD sync — seven numbers, nothing more
// ---------------------------------------------------------------------------
function setText(id, val) {
  const el = ids(id);
  if (el && el.textContent !== val) el.textContent = val;
}

function syncHUD(s) {
  setText('altitude-val', String(Math.round(s.alt)));
  setText('speed-val', String(Math.round(s.speed)));
  setText('g-val', (s.g >= 0 ? '+' : '') + s.g.toFixed(1));
  setText('heart-val', String(s.bpm));
  setText('breath-val', s.resp.toFixed(1));

  const label = `phase 0${s.phaseId} · ${s.phase}`;
  setText('phase-label', label);

  const secs = s.t * 134.4;
  const mm = String(Math.floor(secs / 60)).padStart(2, '0');
  const ss = (secs % 60).toFixed(1).padStart(4, '0');
  setText('time-label', `T+${mm}:${ss}s`);

  const note = ids('breath-note');
  if (note) {
    note.textContent = s.resp <= 0.05 ? "can't breathe up here" : 'breathing… for now';
  }

  const ph = ids('playhead');
  if (ph) ph.style.left = (s.t * 100).toFixed(2) + '%';

  const bars = { 'bar-speed': s.speed / 130, 'bar-g': (s.g + 2) / 7.5, 'bar-heart': (s.bpm - 60) / 130, 'bar-breath': Math.min(1, s.resp / 30) };
  Object.entries(bars).forEach(([id, v]) => {
    const b = ids(id);
    if (b) b.style.width = Math.max(2, Math.min(100, v * 100)).toFixed(1) + '%';
  });
}

// ---------------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------------
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const s = sampleAt(progress);

  if (!paused) {
    const rate = s.phaseId === 1 ? 0.0095 : s.phaseId === 2 ? 0.030 : s.phaseId === 3 ? 0.026 : s.phaseId === 4 ? 0.024 : 0.020;
    progress = (progress + rate * dt) % 1;
  }

  placeTrain(progress);
  applyCamera(s);
  syncHUD(s);
  composer.render();
}

window.addEventListener('resize', () => {
  width = container.clientWidth || width;
  height = container.clientHeight || height;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
  composer.setSize(width, height);
});

// ---------------------------------------------------------------------------
// Public hooks (deterministic capture + UI)
// ---------------------------------------------------------------------------
window.apexScrubTo = (t) => {
  progress = ((t % 1) + 1) % 1;
  const s = sampleAt(progress);
  placeTrain(progress);
  applyCamera(s);
  syncHUD(s);
  composer.render();
};

window.apexSetCamera = (m) => {
  mode = m === 'RIDER' ? 'RIDER' : m === 'CHASE' ? 'CHASE' : m === 'SIDE' || m === 'SIDE_PROFILE' ? 'SIDE' : 'ORBIT';
  const s = sampleAt(progress);
  applyCamera(s);
  composer.render();
  return mode;
};

window.apexStepSimulation = (t, m) => {
  paused = true;
  if (m) window.apexSetCamera(m);
  window.apexScrubTo(t);
};

window.setCamera = function (label, btn) {
  window.apexSetCamera(label);
  document.querySelectorAll('.cam-btn').forEach((b) => {
    b.classList.remove('bg-white', 'text-[#0E1117]', 'font-bold', 'shadow-sm');
    b.classList.add('text-muted', 'font-semibold');
  });
  if (btn) {
    btn.classList.remove('text-muted', 'font-semibold');
    btn.classList.add('bg-white', 'text-[#0E1117]', 'font-bold', 'shadow-sm');
  }
};

fetch('./assets/apex_telemetry.json')
  .then((r) => r.json())
  .then((d) => {
    TELEMETRY = d.samples;
    progress = num('t', 0.12);
    paused = params.has('t');
    const camParam = params.get('cam') || 'ORBIT';
    window.apexSetCamera(camParam);
    const labels = { ORBIT: 0, RIDER: 1, CHASE: 2, SIDE: 0 };
    const btns = document.querySelectorAll('.cam-btn');
    const bi = labels[camParam.toUpperCase()];
    if (btns[bi]) window.setCamera(camParam.toUpperCase(), btns[bi]);
    tick();
  })
  .catch((e) => {
    errors.push('telemetry: ' + e);
    document.body.insertAdjacentHTML('beforeend',
      '<pre style="position:fixed;bottom:0;left:0;z-index:99;color:#f43f5e;font:12px monospace">telemetry failed: ' + e + '</pre>');
  });

</script>

    function setCamera(mode, targetBtn) {
      document.querySelectorAll('.cam-btn').forEach(btn => {

      });
      targetBtn.classList.remove('text-muted', 'font-semibold');

      if (window.apexScrubTo) window.apexScrubTo((e.clientX - r.left) / r.width);
